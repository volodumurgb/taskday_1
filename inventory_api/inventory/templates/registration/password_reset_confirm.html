<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Reset your password</title></head>
<body>
  <h1>Reset your password</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save new password</button>
    </form>
  {% else %}
    <p>This password reset link is invalid or has expired.</p>
  {% endif %}
</body>
</html>
